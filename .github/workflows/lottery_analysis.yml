name: lottery_analysis

on:
  schedule:
    - cron: '0 15 * * *'   # UTC 15:00 = 北京时间 23:00
    - cron: '0 17 * * *'   # UTC 17:00 = 北京时间 次日 01:00
  workflow_dispatch:

# 防止两个定时任务重叠
concurrency:
  group: lottery-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run lottery analysis
        run: |
          echo "开始执行彩票分析脚本..."
          echo "触发时间（UTC）: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "触发时间（北京时间）: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          python lottery_analysis.py all 15

      - name: Commit and push report
        run: |
          if [ ! -f "lottery_report.html" ]; then
            echo "❌ 报告文件不存在"
            exit 1
          fi
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add lottery_report.html
          # 缓存目录也跟着提交（如果存在），保证下次失败能兜底
          if [ -d "lottery_cache" ]; then
            git add lottery_cache/
          fi
          if ! git diff --staged --quiet; then
            BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
            git commit -m "🎯 自动更新彩票分析报告 ${BEIJING_TIME}"
            git pull origin main --rebase
            git push origin main
            echo "✅ 报告提交完成"
          else
            echo "没有变化可提交"
          fi

      - name: Upload report as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lottery-report-${{ github.run_number }}
          path: |
            lottery_report.html
            lottery_cache/
          retention-days: 7

      - name: Show summary
        run: |
          echo "========================================"
          echo "🎰 彩票分析任务完成"
          echo "📅 UTC时间: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "📅 北京时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "🎯 触发方式: ${{ github.event_name }}"
          if [ -f "lottery_report.html" ]; then
            file_size=$(wc -c < lottery_report.html)
            echo "✅ 报告文件: lottery_report.html"
            echo "📊 文件大小: ${file_size} 字节"
            echo "📥 Artifact: lottery-report-${{ github.run_number }}"
          else
            echo "❌ 报告生成失败"
          fi
          echo "========================================"